
[package]
name = "snap-sync"
version = "0.3.1"
edition = "2024"

[workspace]
members = [
    "file-sender",
    "frigate-api-caller",
    "logging",
    "mocks",
    "mqtt-handler",
    "options",
    "randomness",
    "sync-system",
    "test-utils",
    "utils",
]

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }

clap = { workspace = true }
options = { workspace = true }
sync-system = { workspace = true }

[dev-dependencies]
randomness = { workspace = true }
rstest = { workspace = true }
test-utils = { workspace = true }

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.3.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-config = "1.8"
aws-credential-types = "1.2"
aws-smithy-types = "1.3"
aws-sdk-s3 = { version = "1.124", default-features = true }
bytes = "1.10"
ctor = "1.0"
chrono = "0.4"
clap = "4.5"
ctrlc = "3.4"
futures = "0.3"
humantime = "2.2"
image = "0.25"
ini = "1.3"
itertools = "0.15"
libssh2-sys = "0.3"
log = "0.4"
mockall = "0.14"
rand_chacha = "0.10"
serde = "1.0"
serde_json = "1.0"
serde_yml = "0.0"
tap = "1.0"
tempfile = "3.19"
thiserror = "2.0"
tokio = { version = "1.52", default-features = false }
tracing-subscriber = "0.3"
tracing = "0.1"
reqwest = "0.13"
rstest = "0.26"
rumqttc = "0.25"
# Default features pull `rsa`, which drags in a release-candidate RustCrypto
# chain that does not build. The only russh user is the file-sender tests, which
# just generate an Ed25519 key, so the `rsa` feature is dropped here.
russh = { version = "0.61", default-features = false, features = ["flate2", "aws-lc-rs"] }
serial_test = "3.2"
ssh2 = "0.9"
vfs = "0.13"
zeroize = "1.8"

file-sender = { path = "file-sender" }
frigate-api-caller = { path = "frigate-api-caller" }
logging = { path = "logging" }
mocks = { path = "mocks" }
mqtt-handler = { path = "mqtt-handler" }
options = { path = "options" }
randomness = { path = "randomness" }
sync-system = { path = "sync-system" }
test-utils = { path = "test-utils" }
utils = { path = "utils" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
panic = "abort" # prevent panic catching (mostly for the tokio runtime)

[profile.release]
panic = "abort" # prevent panic catching (mostly for the tokio runtime)
overflow-checks = true
